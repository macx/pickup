# Release workflow for Pickup (docs/RELEASING.md).
#
# Trigger: a push to main. Trunk-based: every pull request is squash-merged into main; a release happens when the
# pushed commit is the squash-merged release pull request from prepare-release.yml ("chore(release): vX.Y.Z") or
# changes VERSION, and the tag vX.Y.Z does not exist yet. Every other push ends after the plan job.
#   plan      decide: release or not; version; signed (PICKUP_SIGN_IDENTITY set) or unsigned; pre-release (0.x)
#   ci        every CI job (reusable ci.yml) on exactly this commit
#   release   environment "release" (required reviewer): build, then
#             signed:   sign (Developer ID, Hardened Runtime), notarise, staple -> Pickup-X.Y.Z.{dmg,zip}
#             unsigned: ad-hoc signed, clearly marked -> Pickup-X.Y.Z-UNSIGNED.{dmg,zip} (0.x pre-releases only)
#             GitHub Release with notes from CHANGELOG.md and SHA-256 files; publishing it creates the tag vX.Y.Z
#             on this commit; 0.x releases are marked as pre-releases
#   homebrew  signed releases only: render the cask from the published DMG and push it to macx/homebrew-tap
#
# Secrets (environment "release", names only; values never appear in the logs):
#   RELEASE_TOKEN                    fine-grained token of the maintainer for macx/pickup (Contents and Pull requests:
#                                    read/write): creates the release and the tag (tag ruleset: admin bypass)
#   PICKUP_DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" certificate + private key (.p12)
#   PICKUP_DEVELOPER_ID_P12_PASSWORD password of that .p12
#   PICKUP_NOTARY_KEY_P8             contents of the App Store Connect API key file AuthKey_<KEYID>.p8
#   PICKUP_NOTARY_KEY_ID             its key ID
#   PICKUP_NOTARY_ISSUER_ID          its issuer ID
#   HOMEBREW_TAP_TOKEN               fine-grained token: macx/homebrew-tap only, Contents read/write (+ Pull requests)
# Variables (repository level, so the plan job can read them without the environment approval):
#   PICKUP_SIGN_IDENTITY   "Developer ID Application: David Eiken (<TEAMID>)"; empty = unsigned 0.x pre-releases
#   PICKUP_TAP_MODE        push (default) | pr | off
#   PICKUP_MACOS_RUNNER, PICKUP_DEVELOPER_DIR   see ci.yml
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run on main after a failure; does nothing when the version is already released

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan (version, tag, signing)
    if: github.repository == 'macx/pickup' # official builds come only from the public repository (TRADEMARKS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      signed: ${{ steps.plan.outputs.signed }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags and the parent commit
      - id: plan
        env:
          SIGN_IDENTITY: ${{ vars.PICKUP_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release.yml runs on main only (got $GITHUB_REF)"; exit 1; }
          scripts/set-version.sh --check
          version="$(scripts/set-version.sh --print)"
          subject="$(git log -1 --format=%s)"
          parent_version="$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          release=false
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released; nothing to do."
          elif [ "$(sed -E 's/ \(#[0-9]+\)$//' <<< "$subject")" = "chore(release): v$version" ] || [ "$parent_version" != "$version" ] \
               || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release=true
          else
            echo "::notice::not a release commit and VERSION unchanged ($version); nothing to do."
          fi
          signed=false; [ -n "$SIGN_IDENTITY" ] && signed=true
          prerelease=false; [ "${version%%.*}" = 0 ] && prerelease=true
          if [ "$release" = true ] && [ "$signed" = false ] && [ "$prerelease" = false ]; then
            echo "::error::$version is 1.0 or later but PICKUP_SIGN_IDENTITY is empty: releases from 1.0.0 on must be signed and notarised"; exit 1
          fi
          {
            echo "version=$version"; echo "release=$release"; echo "signed=$signed"; echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, release $release, signed $signed, pre-release $prerelease ($subject)"

  ci:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: sign, notarise, publish
    needs: [plan, ci]
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ vars.PICKUP_MACOS_RUNNER || 'xcode-27' }}
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read # all writes use RELEASE_TOKEN
    env:
      CI: "true"
      VERSION: ${{ needs.plan.outputs.version }}
      SIGNED: ${{ needs.plan.outputs.signed }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      DEVELOPER_DIR: ${{ vars.PICKUP_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      PICKUP_GATE: ci # the "ci" job above is the gate (build-app.sh honours this only inside Actions)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release audit runs gitleaks over the history

      - name: VERSION, Info.plist and package.json agree; the tag does not exist yet
        run: |
          scripts/set-version.sh --check
          [ "$(scripts/set-version.sh --print)" = "$VERSION" ] || { echo "::error::VERSION changed since the plan job"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::v$VERSION already exists"; exit 1; fi

      - name: Install gitleaks and semgrep (release audit)
        run: brew install gitleaks semgrep

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.SIGNED == 'true'
        env:
          P12_BASE64: ${{ secrets.PICKUP_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.PICKUP_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] || { echo "::error::certificate secrets are missing"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/pickup-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple's Developer ID intermediate (public), in case the image lacks it.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign >/dev/null || true
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::no 'Developer ID Application' identity in the imported certificate"; exit 1; }
          echo "PICKUP_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        if: env.SIGNED == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.PICKUP_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          [ -n "$NOTARY_KEY_P8" ] || { echo "::error::PICKUP_NOTARY_KEY_P8 is missing"; exit 1; }
          umask 077
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          echo "PICKUP_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise, staple and package
        if: env.SIGNED == 'true'
        env:
          PICKUP_SIGN_IDENTITY: ${{ vars.PICKUP_SIGN_IDENTITY }}
          PICKUP_NOTARY_KEY_ID: ${{ secrets.PICKUP_NOTARY_KEY_ID }}
          PICKUP_NOTARY_ISSUER_ID: ${{ secrets.PICKUP_NOTARY_ISSUER_ID }}
        run: scripts/package-release.sh

      - name: Build and package UNSIGNED (0.x pre-release, ad-hoc signed, not notarised)
        if: env.SIGNED != 'true'
        run: scripts/package-release.sh --dry-run

      - name: Release notes from CHANGELOG.md
        run: |
          if ! scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            if [ "$SIGNED" = true ]; then
              echo "**Install:** \`brew install --cask macx/tap/pickup\` or download the DMG below (signed with Developer ID, notarised by Apple)."
            else
              echo "> [!WARNING]"
              echo "> **Unsigned pre-release for testing.** This build is not signed with a Developer ID and not notarised by Apple."
              echo "> macOS blocks it on first launch: open it once, then allow it in System Settings > Privacy & Security > \"Open Anyway\"."
              echo "> It is not available through Homebrew. Signed releases follow with 1.0."
            fi
            echo "Requires macOS 26 or newer on Apple silicon. Verify downloads with the \`.sha256\` files."
          } >> "$RUNNER_TEMP/notes.md"

      - name: GitHub Release (draft, upload, publish = create tag v${{ env.VERSION }} on this commit)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::RELEASE_TOKEN is missing in the release environment"; exit 1; }
          tag="v$VERSION"
          name="Pickup-$VERSION"; [ "$SIGNED" = true ] || name="Pickup-$VERSION-UNSIGNED"
          files=(dist/"$name".dmg dist/"$name".zip dist/"$name".dmg.sha256 dist/"$name".zip.sha256)
          flags=(--latest); [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; done
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag appeared on GitHub meanwhile; refusing to publish"; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber   # re-run of a failed attempt
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Pickup $VERSION$([ "$SIGNED" = true ] || echo ' (unsigned pre-release)')" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          # Publishing creates the tag at --target. Only after every asset is there, so Homebrew's livecheck never
          # sees a release without a DMG.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::$tag points to $tagged, expected $GITHUB_SHA"; exit 1; }

      - name: Keep the artifacts and notarisation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pickup-release-${{ env.VERSION }}
          path: dist/
          retention-days: 30
          if-no-files-found: ignore

      - name: Remove the keychain and the API key
        if: always()
        run: |
          [ -n "${PICKUP_KEYCHAIN:-}" ] && security delete-keychain "$PICKUP_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"

  homebrew:
    name: update the Homebrew tap
    needs: [plan, release]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.signed == 'true' && vars.PICKUP_TAP_MODE != 'off'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the cask from the published DMG and publish it to macx/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_MODE: ${{ vars.PICKUP_TAP_MODE || 'push' }}
          PICKUP_RELEASE_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          case "$TAP_MODE" in push|pr) ;; *) echo "::error::PICKUP_TAP_MODE must be push, pr or off"; exit 1 ;; esac
          scripts/update-cask.sh --version "$VERSION" --download "--$TAP_MODE"
